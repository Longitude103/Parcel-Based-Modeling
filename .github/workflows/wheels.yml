name: Wheels

# Self-contained wheels (Fortran runtime bundled) for Windows, macOS and Linux.
on:
  pull_request:
    paths:
      - "fortran/**"
      - "src/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        if: runner.os != 'Linux'
        with:
          compiler: gcc
          version: 13
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
